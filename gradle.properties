# Use the Windows certificate store, so downloads work when antivirus software inspects HTTPS.
# On macOS or Linux, remove the trustStoreType options from both lines below.
org.gradle.jvmargs=-Xmx3G -Djavax.net.ssl.trustStoreType=Windows-ROOT
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
org.gradle.parallel=true
org.gradle.configuration-cache=true

