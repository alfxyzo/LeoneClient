plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "leoneclient"
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			programArgs "--width", "1600", "--height", "900", "--quickPlaySingleplayer", "Leone Test"
		}
		// Development only: joins (or creates) a test world, drives the menu and features, and saves screenshots
		autotest {
			client()
			name "Minecraft Client (Leone autotest)"
			programArgs "--width", "1600", "--height", "900"
			vmArg "-Dleoneclient.autotest=true"
			runDir "run-autotest"
		}
	}

	mods {
		"leoneclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu is optional: compiled against for the config button, present in dev runs for testing it
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	runtimeOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE.txt") {
		rename { "${it}_leoneclient" }
	}
}
